<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجّل بصمتك | انتبه للتفاصيل</title>
<script>
  // ضع هنا رابط Google Apps Script (اللي ينتهي بـ /exec)
  const API_URL = "https://script.google.com/macros/s/AKfycbwY0vJmSCZgyeZdbav5PlIm0PX81yMfWnAbNDX4DCufKLCQm49n6DVM_YGN37NvFGCU/exec";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --navy:#030b26; --navy2:#071536; --card:#0a1a42; --line:#1d3160;
  --text:#f2f5fa; --muted:#a3b1c9; --dim:#6f7f9e;
  --green:#00c000; --lime:#8cc63f; --ink:#03140a; --red:#ff8f85; --gold:#f2c230;
  --font:'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--navy)}
body{min-height:100vh;background:var(--navy);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;padding-inline:16px;
  background-image:radial-gradient(ellipse 70% 45% at 100% 0%,rgba(40,150,70,.28),transparent 70%),radial-gradient(ellipse 60% 40% at 0% 100%,rgba(10,70,110,.25),transparent 70%)}
.wrap{max-width:520px;margin-inline:auto;padding-block:32px 48px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.fp{width:112px;height:112px;color:var(--lime);filter:drop-shadow(0 0 22px rgba(140,198,63,.45))}
.fp svg{width:100%;height:100%}
.eyebrow{font-size:14px;font-weight:700;color:var(--lime)}
h1{font-size:34px;font-weight:700;line-height:1.3}
h1 .tag{display:inline-block;background:var(--green);color:var(--navy);padding:0 14px 4px;border-radius:12px;transform:rotate(-3deg);box-shadow:0 0 30px rgba(0,192,0,.4)}
.sub{font-size:15.5px;color:var(--muted);max-width:40ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:14.5px;font-weight:500;margin-bottom:6px}
label small{color:var(--dim);font-weight:400}
input,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--navy2);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
input:focus,select:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(140,198,63,.18)}
input.code{font-size:26px;font-weight:700;text-align:center;letter-spacing:.08em;color:var(--lime);padding:12px}
input.code::placeholder{color:#34507a;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none;width:1px}
.chips label{margin:0;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);border:1.5px solid var(--line);border-radius:99px;padding:5px 14px}
.chips input:checked+label{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.chips input:focus-visible+label{outline:2px solid var(--lime);outline-offset:2px}
.err{font-size:14px;color:var(--red);min-height:1em}
button.go{font:inherit;font-size:18px;font-weight:700;color:var(--ink);background:var(--green);border:0;border-radius:99px;padding:14px;cursor:pointer;box-shadow:0 0 34px rgba(0,192,0,.35)}
button.go:disabled{opacity:.55;cursor:wait}
button:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.hint{font-size:13.5px;color:var(--dim);text-align:center}
.done{display:none;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 20px;border-color:rgba(140,198,63,.55);background:linear-gradient(180deg,rgba(140,198,63,.12),transparent 70%),var(--card)}
.done.on{display:flex}
.done .big{font-size:44px;font-weight:700;color:var(--lime);line-height:1.1;letter-spacing:.06em}
.done h2{font-size:24px;font-weight:700}
.done p{font-size:15px;color:var(--muted)}
.done p b{color:var(--lime);font-size:18px}
.done button{font:inherit;font-size:15px;font-weight:500;color:var(--text);background:transparent;border:1.5px solid var(--line);border-radius:99px;padding:8px 22px;cursor:pointer;margin-top:6px}
.loading{text-align:center;color:var(--muted);font-size:15px}
footer{display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
footer b{font-family:Poppins,'Segoe UI',sans-serif;font-size:20px;color:var(--text)}
footer b i{font-style:normal;color:var(--green)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="fp" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
    </div>
    <div class="eyebrow">انتبه للتفاصيل · أكتوبر 2026</div>
    <h1>لقيت البصمة؟ <span class="tag">سجّلها</span></h1>
    <p class="sub">اكتب الرمز اللي جنب البصمة المخفية. كل بصمة صحيحة = فرصة بدخولك عجلة الحظ بالمعرض الختامي.</p>
  </header>

  <p class="loading" id="loading">لحظة...</p>

  <form class="card" id="form" novalidate hidden>
    <div>
      <label for="code">رمز البصمة</label>
      <input class="code" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ب-K7Q" maxlength="12">
    </div>
    <div>
      <label for="emp">الرقم الوظيفي</label>
      <input id="emp" inputmode="numeric" autocomplete="off" placeholder="مثال: 12345" maxlength="10">
    </div>
    <div>
      <label for="topic">البوست يتكلم عن إيش؟</label>
      <input id="topic" autocomplete="off" placeholder="مثال: رسائل التصيد" maxlength="120">
    </div>
    <div>
      <label>وين لقيتها؟ <small>(اختياري)</small></label>
      <div class="chips" id="where"></div>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="go" type="submit" id="go">سجّل البصمة</button>
    <p class="hint">كل رمز ينحسب لك مرة وحدة بس</p>
  </form>

  <div class="card done" id="done" role="status">
    <div class="big" id="doneCode"></div>
    <h2>انسجلت بصمتك!</h2>
    <p>ركّز في البوست الجاي، فيه بصمة ثانية.</p>
    <button type="button" id="again">سجّل بصمة ثانية</button>
  </div>

  <footer>الإدارة العامة للأمن السيبراني <b dir="ltr">gosi<i>›</i></b></footer>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PROFILE = 'fp-profile-2026';

  function load(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text != null) e.textContent = text;
    return e;
  }

  var CHANNELS = ['إيميل', 'شاشة', 'بوستر مطبوع', 'سناب'];

  function start() {
    var where = $('where');
    CHANNELS.forEach(function (ch, i) {
      where.appendChild(el('input', { type: 'radio', name: 'where', id: 'w' + i, value: ch }));
      where.appendChild(el('label', { for: 'w' + i }, ch));
    });
    var p = load(PROFILE);
    if (p.emp) $('emp').value = p.emp;
    $('loading').hidden = true;
    $('form').hidden = false;
    $('code').focus();
  }

  function showError(msg) { $('err').textContent = msg; }

  function busy(on) {
    $('go').disabled = on;
    $('go').textContent = on ? 'جاري التسجيل...' : 'سجّل البصمة';
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    showError('');
    var data = {
      code: $('code').value.trim(),
      empId: $('emp').value.trim(),
      topic: $('topic').value.trim(),
      channel: (document.querySelector('input[name=where]:checked') || {}).value || ''
    };
    if (!data.code) { showError('اكتب رمز البصمة.'); $('code').focus(); return; }
    if (!data.empId) { showError('اكتب رقمك الوظيفي.'); $('emp').focus(); return; }
    if (data.topic.length < 2) { showError('اكتب وش يتكلم عنه البوست.'); $('topic').focus(); return; }

    save(PROFILE, { emp: data.empId });
    busy(true);
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data),
      redirect: 'follow'
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        busy(false);
        if (!res || !res.ok) { showError((res && res.message) || 'صار خطأ. جرّب مرة ثانية.'); return; }
        $('doneCode').textContent = res.code;
        $('form').hidden = true;
        $('done').classList.add('on');
      })
      .catch(function () {
        busy(false);
        showError('ما قدرنا نسجّل الحين. تأكد من اتصالك وجرّب مرة ثانية.');
      });
  });

  $('again').addEventListener('click', function () {
    $('done').classList.remove('on');
    $('form').hidden = false;
    $('code').value = '';
    $('topic').value = '';
    document.querySelectorAll('input[name=where]').forEach(function (r) { r.checked = false; });
    $('code').focus();
  });

  start();
})();
</script>
</body>
</html>
